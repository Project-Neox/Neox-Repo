name: "APT Depo Yayını"

# pool/'a .deb atildiginda (veya site/script degistiginde) APT deposunu derler,
# imzasiz depoyu ucundan uca test eder ve gh-pages dalina yayinlar.
on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "pool/**"
      - "scripts/**"
      - "index.html"
      - "app.js"
      - "style.css"
      - "archive-upload.html"
      - ".github/workflows/apt-repo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apt-repo-publish
  cancel-in-progress: true

jobs:
  publish:
    name: "Derle, test et, yayinla"
    runs-on: ubuntu-latest
    steps:
      - name: "Depoyu cek"
        uses: actions/checkout@v4

      - name: "Araclar kuruluyor (dpkg-dev, apt-utils, python3)"
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils python3

      - name: "APT deposu imzasiz olarak derleniyor"
        run: bash scripts/build-apt-repo.sh public

      - name: "Depo apt ile test ediliyor (apt update + paket indirme)"
        run: bash scripts/selftest-apt-repo.sh public

      - name: "gh-pages dalina (GitHub Pages) yayinlaniyor"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf --quiet . || true
          fi
          # gh-pages icerigini staging (public/) ile esitle
          find . -mindepth 1 -maxdepth 1 ! -name 'public' ! -name '.git' -exec rm -rf {} +
          cp -r public/. .
          rm -rf public
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok, yayin atlaniyor"
          else
            git commit -m "APT deposu guncellendi: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin gh-pages
            echo "Yayin tamamlandi: https://project-neox.github.io/Neox-Repo/"
          fi
