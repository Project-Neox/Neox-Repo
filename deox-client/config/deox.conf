# DEOX ana yapılandırma dosyası
# Sistem konumu: /etc/deox/deox.conf
# Kullanıcı konumu: ~/.config/deox/deox.conf (bunun üzerine yazar)

[general]
# Önbellek dizini (.deb dosyaları burada tutulur)
CacheDir = /var/cache/deox/
# Veritabanı dizini (sync/ ve local/ alt dizinleri otomatik oluşturulur)
DBPath = /var/lib/deox/
# Log dosyası
LogFile = /var/log/deox.log
# Hedef mimari: auto (dpkg --print-architecture) veya amd64, arm64, armhf, i386
Architecture = auto
# Renkli terminal çıktısı
Color = true
# Paralel indirme sayısı (aynı anda indirilecek paket)
ParallelDownloads = 5
# İndirme zaman aşımı (saniye)
DownloadTimeout = 30
# Onay sormadan devam et (true/false)
NoConfirm = false
# Proxy (boş bırakılırsa ortam değişkenleri kullanılır)
# Örn: Proxy = http://127.0.0.1:8080
Proxy =

# Depo bölümleri (aşağıda) bu dosyada tanımlanabilir; ancak depo listesi
# asıl olarak /etc/deox/repos.conf üzerinden yönetilir (bkz. --add-repo).

[repositories]

[deox-core]
Server = https://raw.githubusercontent.com/KULLANICI/deox-repo/main/
Enabled = true
Priority = 100

[deox-community]
Server = https://raw.githubusercontent.com/KULLANICI/deox-community/main/
Enabled = true
Priority = 200
