# DEOX depo kaynakları
# Sistem konumu: /etc/deox/repos.conf
#
# Her bölüm bir depoyu temsil eder:
#   Server   = depo kök URL'si (db/deox.db ve deoxpool/ bu dizinin altında)
#   Enabled  = depo etkin mi?
#   Priority = öncelik (düşük sayı = yüksek öncelik)
#
# Depo eklemek için: deox --add-repo <isim> <url>
#                   veya bu dosyayı elle düzenleyip `deox -Sy` çalıştırmak.

[deox-core]
Server = https://raw.githubusercontent.com/KULLANICI/deox-repo/main/
Enabled = true
Priority = 100
